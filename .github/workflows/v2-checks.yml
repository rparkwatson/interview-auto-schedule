name: Interview Scheduler v2 checks

on:
  pull_request:
    paths:
      - "v2/**"
      - "app.py"
      - "requirements.txt"
      - ".streamlit/config.toml"
      - ".github/workflows/v2-checks.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "v2/**"
      - "app.py"
      - "requirements.txt"
      - ".streamlit/config.toml"
      - ".github/workflows/v2-checks.yml"

permissions:
  contents: read

concurrency:
  group: v2-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-v2:
    name: Python 3.11 validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            v2/requirements.txt
            v2/requirements-dev.txt

      - name: Install production dependencies and test tools
        run: python -m pip install -r requirements.txt "pytest>=8,<9"

      - name: Run automated tests
        run: python -m pytest v2/tests -q

      - name: Verify production-app startup
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run app.py \
            --server.headless true \
            --server.port 8501 \
            > streamlit-production.log 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8501/_stcore/health | grep --quiet "ok"; then
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          cat streamlit-production.log
          exit 1
